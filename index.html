<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hachi Net - Warnasari</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{font-family:system-ui,sans-serif} .no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

function App(){
  const [isLoggedIn,setIsLoggedIn]=useState(false);
  const [user,setUser]=useState({username:"",password:""});
  const [dark,setDark]=useState(false);
  const [tab,setTab]=useState("dashboard");
  const [search,setSearch]=useState("");
  const [laguNyala,setLaguNyala]=useState(false);
  const [clients,setClients]=useState([
    {id:1,nama:"Dole",noIdentitas:"3201123456780001",paket:"30 Mbps",harga:125000,alamat:"Kp. 30 Mbps",status:"Aktif",odp:"ODP-WRN-01",sn:"HWTC11223344",ip:"192.168.1.101",rx:"-20.1 dBm",bayar:"Belum Lunas",hp:"62812-3456789"},
    {id:2,nama:"Sulaeman",noIdentitas:"3201123456780002",paket:"20 Mbps",harga:100000,alamat:"Kp. Warnasari",status:"Aktif",odp:"ODP-WRN-01",sn:"VSOL99887766",ip:"192.168.1.102",rx:"-18.8 dBm",bayar:"Lunas",hp:"62812-3456790"},
    {id:3,nama:"Rudi Hartono",noIdentitas:"3201123456780003",paket:"50 Mbps",harga:180000,alamat:"Kp. Warnasari",status:"Aktif",odp:"ODP-WRN-02",sn:"HWTC55667788",ip:"192.168.1.103",rx:"-22.1 dBm",bayar:"Lunas",hp:"62812-3456791"},
  ]);
  const [newClient,setNewClient]=useState({nama:"",paket:"30 Mbps",alamat:"",hp:"",sn:""});

  const login=(e)=>{
    e.preventDefault();
    if(user.username==="admin" && user.password==="admin"){setIsLoggedIn(true);} 
    else if(user.username==="kasir" && user.password==="kasir"){setIsLoggedIn(true);}
    else{alert("Username / Password salah! Coba admin / admin");}
  };

  const tambahPelanggan=(e)=>{
    e.preventDefault();
    if(!newClient.nama) return alert("Nama wajib diisi");
    const harga = newClient.paket==="20 Mbps"?100000:newClient.paket==="30 Mbps"?125000:180000;
    setClients([...clients,{id:clients.length+1,nama:newClient.nama,paket:newClient.paket,harga,alamat:newClient.alamat||"Kp. Warnasari",status:"Aktif",odp:"ODP-WRN-01",sn:newClient.sn||"HWTC"+Math.floor(Math.random()*100000000),ip:"192.168.1."+(100+clients.length+1),rx:"-19.5 dBm",bayar:"Belum Lunas",hp:newClient.hp}]);
    setNewClient({nama:"",paket:"30 Mbps",alamat:"",hp:"",sn:""});
    alert("Pelanggan berhasil ditambah! STB / ONT siap didaftarkan.");
  };

  const filtered = clients.filter(c=>c.nama.toLowerCase().includes(search.toLowerCase())||c.sn.toLowerCase().includes(search.toLowerCase()));

  if(!isLoggedIn){
    return (
      <div className={"min-h-screen flex items-center justify-center p-4 "+(dark?"bg-gray-900":"bg-amber-400")}>
        <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6">
          <div className="text-center">
            <div className="text-7xl">🐝</div>
            <h1 className="text-3xl font-black mt-2">HACHI <span className="text-amber-500">NET</span></h1>
            <p className="text-gray-500 text-sm">Warnasari • Internet Cepat, Harga Merakyat</p>
            <button onClick={()=>setDark(!dark)} className="mt-3 text-xs bg-black text-white px-3 py-1 rounded-full">{dark?"☀️ Mode Siang":"🌙 Mode Malam"}</button>
          </div>
          <form onSubmit={login} className="mt-6 space-y-3">
            <input value={user.username} onChange={e=>setUser({...user,username:e.target.value})} placeholder="Username : admin" className="w-full border rounded-xl px-4 py-3"/>
            <input type="password" value={user.password} onChange={e=>setUser({...user,password:e.target.value})} placeholder="Password : admin" className="w-full border rounded-xl px-4 py-3"/>
            <button className="w-full bg-amber-400 font-bold py-3 rounded-xl">MASUK 🚀</button>
          </form>
          <div className="mt-4 bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-xs">
            <b>Demo Login:</b><br/>Admin : admin / admin<br/>Kasir : kasir / kasir
          </div>
          <div className="mt-4 text-center">
            <button onClick={()=>setLaguNyala(!laguNyala)} className="text-sm bg-red-100 px-4 py-2 rounded-full font-bold">▶️ {laguNyala?"Matikan Lagu":"Putar Lagu Kroncong Protol"}</button>
            {laguNyala && <div className="mt-3"><iframe width="100%" height="160" src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1" allow="autoplay" frameborder="0"></iframe><p className="text-[11px] text-gray-400 mt-1">Kroncong Protol - Bondan Prakoso</p></div>}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={"min-h-screen "+(dark?"bg-gray-900 text-white":"bg-gray-100")}>
      <div className="bg-amber-400 p-4 flex justify-between items-center sticky top-0 z-10">
        <div className="flex items-center gap-2"><span className="text-3xl">🐝</span><div><b className="text-lg leading-none">HACHI NET</b><p className="text-[11px]">Warnasari • {user.username}</p></div></div>
        <div className="flex gap-2">
          <button onClick={()=>setDark(!dark)} className="bg-black text-white text-xs px-3 py-2 rounded-full">{dark?"☀️":"🌙"}</button>
          <button onClick={()=>setIsLoggedIn(false)} className="bg-white text-xs font-bold px-3 py-2 rounded-full">Keluar</button>
        </div>
      </div>

      <div className="p-4 max-w-6xl mx-auto">
        <div className="flex gap-2 overflow-x-auto no-scrollbar">
          {["dashboard","pelanggan","tambah","odp","tiket"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} className={"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap "+(tab===t?"bg-black text-white":"bg-white text-black")}>{t==="dashboard"?"📊 Dashboard":t==="pelanggan"?"👥 Pelanggan":t==="tambah"?"➕ Tambah":t==="odp"?"📡 ODP / OLT":"🎫 Tiket"}</button>
          ))}
        </div>

        {tab==="dashboard" && (
          <div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
              <div className="bg-white text-black rounded-2xl p-4"><p className="text-xs text-gray-500">Total Pelanggan</p><b className="text-2xl">{clients.length} Orang</b></div>
              <div className="bg-white text-black rounded-2xl p-4"><p className="text-xs text-gray-500">Aktif</p><b className="text-2xl text-green-600">{clients.filter(c=>c.status==="Aktif").length}</b></div>
              <div className="bg-white text-black rounded-2xl p-4"><p className="text-xs text-gray-500">Belum Lunas</p><b className="text-2xl text-red-500">{clients.filter(c=>c.bayar==="Belum Lunas").length}</b></div>
              <div className="bg-white text-black rounded-2xl p-4"><p className="text-xs text-gray-500">Pendapatan / Bln</p><b className="text-xl">Rp {clients.reduce((a,b)=>a+b.harga,0).toLocaleString("id-ID")}</b></div>
            </div>
            <div className="bg-white text-black rounded-2xl p-4 mt-3">
              <b>🎵 Lagu & STB VPS</b>
              <p className="text-sm text-gray-600 mt-1">STB HG680P / B860H siap dijadikan VPS. File ini sudah siap dihubungkan ke STB nanti, tinggal ganti API ke IP STB.</p>
              <button onClick={()=>setLaguNyala(!laguNyala)} className="mt-3 bg-red-500 text-white px-4 py-2 rounded-full text-sm font-bold">{laguNyala?"⏸️ Matikan":"▶️ Putar Kroncong Protol"}</button>
              {laguNyala && <iframe className="mt-3 w-full rounded-xl" height="180" src="https://www.youtube.com/embed/5qap5aO4i9A?autoplay=1" allow="autoplay" frameborder="0"></iframe>}
            </div>
            <div className="bg-white text-black rounded-2xl p-4 mt-3">
              <b>📡 OLT & MikroTik</b>
              <p className="text-sm mt-2">OLT: VSOL OLT Utama Warnasari - 192.168.1.100 - <span className="text-green-600 font-bold">Online</span></p>
              <p className="text-sm">MikroTik RB4011 - 192.168.1.1 - <span className="text-green-600 font-bold">Online</span></p>
              <p className="text-sm">STB VPS: Siap dihubungkan (IP STB nanti)</p>
            </div>
          </div>
        )}

        {tab==="pelanggan" && (
          <div className="mt-4">
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Cari nama / SN modem..." className="w-full bg-white text-black rounded-xl px-4 py-3 mb-3"/>
            <div className="space-y-3">
              {filtered.map(c=>(
                <div key={c.id} className="bg-white text-black rounded-2xl p-4">
                  <div className="flex justify-between"><b>{c.nama}</b><span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">{c.status}</span></div>
                  <p className="text-sm text-gray-500">{c.paket} • Rp {c.harga.toLocaleString("id-ID")} • {c.bayar}</p>
                  <p className="text-xs mt-2">SN: {c.sn} | IP: {c.ip} | RX: {c.rx} | ODP: {c.odp}</p>
                  <p className="text-xs">📍 {c.alamat} • 📞 {c.hp}</p>
                  <a href={"https://wa.me/"+c.hp} target="_blank" className="inline-block mt-2 bg-green-500 text-white text-xs px-3 py-1 rounded-full font-bold">Chat WA</a>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==="tambah" && (
          <form onSubmit={tambahPelanggan} className="bg-white text-black rounded-2xl p-4 mt-4 space-y-3">
            <b>➕ Registrasi Pelanggan Baru + STB / ONT</b>
            <input value={newClient.nama} onChange={e=>setNewClient({...newClient,nama:e.target.value})} placeholder="Nama Pelanggan" className="w-full border rounded-xl px-4 py-3"/>
            <input value={newClient.hp} onChange={e=>setNewClient({...newClient,hp:e.target.value})} placeholder="No WA, contoh 62812..." className="w-full border rounded-xl px-4 py-3"/>
            <input value={newClient.alamat} onChange={e=>setNewClient({...newClient,alamat:e.target.value})} placeholder="Alamat" className="w-full border rounded-xl px-4 py-3"/>
            <input value={newClient.sn} onChange={e=>setNewClient({...newClient,sn:e.target.value})} placeholder="SN Modem / STB (bisa di-scan nanti)" className="w-full border rounded-xl px-4 py-3"/>
            <select value={newClient.paket} onChange={e=>setNewClient({...newClient,paket:e.target.value})} className="w-full border rounded-xl px-4 py-3">
              <option>20 Mbps - Rp 100.000</option><option>30 Mbps - Rp 125.000</option><option>50 Mbps - Rp 180.000</option>
            </select>
            <button className="w-full bg-amber-400 font-bold py-3 rounded-xl">Simpan & Daftarkan ke STB / OLT</button>
          </form>
        )}

        {tab==="odp" && (
          <div className="bg-white text-black rounded-2xl p-4 mt-4">
            <b>📡 Daftar ODP - Warnasari</b>
            <p className="text-sm mt-2">ODP-WRN-01 - 8 Port - Terisi 5 - 62% - Tikor: -6.52, 106.80</p>
            <p className="text-sm">ODP-WRN-02 - 8 Port - Terisi 3 - 37% - Tikor: -6.52, 106.81</p>
            <p className="text-sm">OLT Utama Warnasari - VSOL - 192.168.1.100</p>
          </div>
        )}

        {tab==="tiket" && (
          <div className="bg-white text-black rounded-2xl p-4 mt-4">
            <b>🎫 Tiket Gangguan</b>
            <p className="text-sm mt-2">TCK-001 - Dole - Gangguan Jaringan - <span className="text-red-500 font-bold">Darurat</span> - Teknisi: Teknisi 1</p>
            <p className="text-sm mt-1">TCK-002 - Sulaeman - LOS / Merah - <span className="text-yellow-600 font-bold">Proses</span></p>
            <p className="text-xs text-gray-400 mt-3">Nanti tiket ini nyambung ke teknisi via WA otomatis.</p>
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
